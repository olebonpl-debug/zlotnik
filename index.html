<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Злотник — Книга расходов</title>
<meta name="theme-color" content="#8b3a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Злотник">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fffef9;
    --text: #1a1a1a;
    --muted: #6b6560;
    --accent: #8b3a3a;
    --accent-dark: #6b2a2a;
    --soft: #f0ebe3;
    --border: #e8e2d8;
    --ok: #2e7d4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    max-width: 420px;
    margin: 0 auto;
  }
  button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .title-block small { color: var(--muted); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .title-block h1 { font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .btn-pill {
    background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 10px 16px; font-size: 14px; cursor: pointer;
  }
  h2 { font-size: 18px; margin: 18px 0 10px; }
  h3 { font-size: 16px; }
  .input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  input[type="text"], input[type="date"], input[type="number"], select, .field {
    background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 14px 18px; font-size: 16px; outline: none; width: 100%;
    font-family: inherit; color: var(--text); -webkit-appearance: none; appearance: none;
  }
  .input-row input { flex: 1; min-width: 0; }
  input:focus, select:focus { border-color: var(--accent); }
  .btn-black {
    background: #1a1a1a; color: #fff; border: none; border-radius: 16px;
    padding: 14px 14px; font-size: 15px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .btn-voice {
    background: var(--accent); color: #fff; border: none; width: 52px; height: 52px; flex-shrink: 0;
    border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative; touch-action: manipulation;
  }
  .btn-voice.listening { background: #c0392b; animation: pulse 1.2s ease-in-out infinite; }
  .btn-voice.keyboard { background: var(--accent-dark); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(192,57,43,.55); }
    70% { box-shadow: 0 0 0 14px rgba(192,57,43,0); }
    100% { box-shadow: 0 0 0 0 rgba(192,57,43,0); }
  }
  .input-row input.listening { border-color: #c0392b; background: #fff8f6; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .msg { font-size: 14px; margin: 4px 0 12px; min-height: 20px; }
  .msg.error { color: #c0392b; }
  .msg.info { color: var(--muted); }
  .msg.ok { color: var(--ok); }
  .msg.rec { color: #c0392b; font-weight: 600; }
  .categories { display: block; margin-bottom: 20px; }
  .cat-group { margin-bottom: 10px; }
  .cat-group-label { font-size: 12px; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; margin: 0 4px 6px; font-weight: 700; }
  .cat-group-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; font-size: 14px; cursor: pointer; min-height: 44px; }
  .cat.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .sum-card { background: #fff; border-radius: 16px; padding: 16px; }
  .sum-card.highlight { background: var(--accent); color: #fff; }
  .sum-card small { display: block; font-size: 12px; opacity: 0.8; margin-bottom: 4px; letter-spacing: 0.5px; }
  .sum-card .val { font-size: 22px; font-weight: 700; white-space: nowrap; }
  button.sum-card {
    text-align: left; border: none; cursor: pointer; width: 100%; font: inherit; color: inherit;
    position: relative; -webkit-appearance: none; appearance: none;
  }
  button.sum-card:active { filter: brightness(0.97); }
  button.sum-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.sum-card.highlight:focus-visible { outline-color: #fff; }
  .sum-card .chev { position: absolute; right: 12px; top: 12px; opacity: 0.55; font-size: 20px; line-height: 1; font-weight: 400; }
  button.cat-hit {
    display: block; width: 100%; background: transparent; border: none; padding: 8px 4px 4px; margin: 0 0 8px;
    cursor: pointer; text-align: left; border-radius: 12px; min-height: 44px; font: inherit; color: inherit;
    -webkit-appearance: none; appearance: none;
  }
  button.cat-hit:active { background: var(--soft); }
  button.cat-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--soft); }
  button.cat-hit .cat-row { margin-bottom: 6px; }
  button.cat-hit .bar { margin-bottom: 0; }
  .drill-sub { color: var(--muted); font-size: 13px; margin: -6px 0 10px; }
  .drill-total-label { font-size: 12px; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
  .drill-total { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
  .drill-count { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .drill-kicker, .drill-list-label { font-size: 13px; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; margin: 8px 0 8px; font-weight: 600; }
  .drill-list-label { margin-top: 16px; }
  button.drill-cat {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; background: #fff; border: none; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer; min-height: 48px; text-align: left; font: inherit; font-size: 15px; color: inherit;
    -webkit-appearance: none; appearance: none;
  }
  button.drill-cat:active { background: var(--soft); }
  button.drill-cat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.drill-cat .name { word-break: break-word; }
  button.drill-cat .right { white-space: nowrap; }
  button.drill-cat .chev { color: var(--muted); font-size: 20px; line-height: 1; }
  #drillOverlay { z-index: 40; }
  #editOverlay { z-index: 60; }
  #drillBack[hidden] { display: none !important; }
  .sheet-head { gap: 8px; }
  .sheet-head h3 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .month-nav { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 20px; }
  .month-nav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: #fff; font-size: 18px; cursor: pointer; }
  .month-nav .center { text-align: center; }
  .month-nav .center strong { display: block; }
  .by-cat h3 { margin-bottom: 4px; }
  .group-block { margin-top: 10px; }
  button.group-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    width: 100%; background: #fff; border: none; border-radius: 16px; padding: 14px;
    margin: 0 0 6px; min-height: 52px; cursor: pointer; text-align: left; font: inherit;
    font-size: 16px; font-weight: 700; color: inherit; -webkit-appearance: none; appearance: none;
  }
  button.group-head:active { background: var(--soft); }
  button.group-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.group-head .chev { color: var(--muted); font-weight: 400; font-size: 20px; }
  button.group-head span:last-child { white-space: nowrap; }
  .group-block .empty { padding: 6px 8px 12px; text-align: left; }
  .manage-label { font-size: 13px; font-weight: 700; margin: 14px 4px 8px; }
  .cat-manage-row .move { width: auto; min-width: 42px; padding: 0 10px; font-size: 13px; }
  .cat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; gap: 8px; }
  .cat-row .chev { color: var(--muted); }
  .bar { height: 6px; background: #e8e2d8; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 3px; }
  .records { margin-top: 10px; }
  .records h3 { margin-bottom: 10px; }
  .record {
    background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    cursor: pointer; width: 100%; text-align: left; border: none; font-size: 15px;
  }
  .record:active { background: var(--soft); }
  .record .title { word-break: break-word; }
  .record .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .record strong { white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  /* Bottom sheet */
  .overlay {
    position: fixed; inset: 0; background: rgba(26,26,26,.45); display: none;
    align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h3 { font-size: 20px; }
  .close-x { background: #fff; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  label.lbl { display: block; font-size: 12px; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; margin: 12px 0 6px 4px; }
  .btns { display: flex; gap: 8px; margin-top: 18px; }
  .btns > button { flex: 1; }
  .btn-accent { background: var(--accent); color: #fff; border: none; border-radius: 16px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-ghost { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 14px; font-size: 15px; cursor: pointer; }
  .btn-danger { background: #fff; color: #c0392b; border: 1px solid #e6b8b1; border-radius: 16px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .cat-manage-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .cat-manage-row input { flex: 1; min-width: 0; padding: 10px 14px; }
  .icon-btn { background: #fff; border: 1px solid var(--border); border-radius: 12px; width: 42px; height: 42px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .icon-btn.del { color: #c0392b; }
  .section { background: #fff; border-radius: 16px; padding: 14px; margin-top: 14px; }
  .section h4 { font-size: 15px; margin-bottom: 8px; }
  .section p { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .section .btns { margin-top: 8px; flex-wrap: wrap; }
  .section select { border-radius: 14px; padding: 12px 14px; }
  .env-note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <small>КНИГА РАСХОДОВ</small>
    <h1>Злотник</h1>
  </div>
  <button class="btn-pill" id="btnDirections" type="button">Направления</button>
</header>

<h2>Новый расход</h2>
<div class="input-row">
  <input type="text" id="input" placeholder="Продукты 70" autocomplete="off" autocorrect="off" enterkeyhint="done" inputmode="text">
  <button class="btn-black" id="btnSave" type="button">Записать</button>
  <button class="btn-voice" id="btnVoice" type="button" title="Голосовой ввод" aria-label="Голосовой ввод">🎤</button>
</div>
<div class="hint" id="hint">Нажми 🎤 и скажи: «продукты 70», «вчера кофе 18», «бедронка 87,40».</div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>

<div class="categories" id="categories"></div>

<div class="summary" id="summary"></div>

<div class="month-nav">
  <button id="prevMonth" type="button" aria-label="Предыдущий месяц">‹</button>
  <div class="center">
    <strong id="monthLabel"></strong>
    <span id="monthTotal">0 zł</span>
  </div>
  <button id="nextMonth" type="button" aria-label="Следующий месяц">›</button>
</div>

<div class="by-cat">
  <h3>По направлениям</h3>
  <div id="byCategories"></div>
</div>

<div class="records">
  <h3>Записи</h3>
  <div id="recordsList"></div>
</div>

<!-- Drill-down: period or category totals -->
<div class="overlay" id="drillOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="drillTitle" aria-describedby="drillSub">
    <div class="sheet-head">
      <button class="close-x" id="drillBack" type="button" aria-label="Назад" hidden>‹</button>
      <h3 id="drillTitle"></h3>
      <button class="close-x" type="button" data-close="drillOverlay" aria-label="Закрыть">✕</button>
    </div>
    <p class="drill-sub" id="drillSub"></p>
    <div class="drill-total-label">Итого</div>
    <div class="drill-total" id="drillTotal"></div>
    <div class="drill-count" id="drillCount"></div>
    <div id="drillCats"></div>
    <h3 class="drill-list-label" id="drillListLabel">Записи</h3>
    <div id="drillList"></div>
  </div>
</div>

<!-- Edit record sheet -->
<div class="overlay" id="editOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="sheet-head"><h3 id="editTitle">Запись</h3><button class="close-x" type="button" data-close="editOverlay" aria-label="Закрыть">✕</button></div>
    <label class="lbl" for="editAmount">Сумма, zł</label>
    <input type="text" id="editAmount" inputmode="decimal" autocomplete="off">
    <label class="lbl" for="editCategory">Направление</label>
    <select id="editCategory"></select>
    <label class="lbl" for="editDate">Дата</label>
    <input type="date" id="editDate">
    <label class="lbl" for="editNote">Описание</label>
    <input type="text" id="editNote" autocomplete="off">
    <div class="msg error" id="editMsg"></div>
    <div class="btns">
      <button class="btn-danger" type="button" id="editDelete">Удалить</button>
      <button class="btn-accent" type="button" id="editSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Categories & settings sheet -->
<div class="overlay" id="catOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="catTitle">
    <div class="sheet-head"><h3 id="catTitle">Направления</h3><button class="close-x" type="button" data-close="catOverlay" aria-label="Закрыть">✕</button></div>
    <div id="catManageList"></div>
    <div class="msg error" id="catMsg"></div>

    <div class="section">
      <h4>Голосовой ввод</h4>
      <label class="lbl" for="langSelect">Язык распознавания</label>
      <select id="langSelect">
        <option value="ru-RU">Русский (ru-RU)</option>
        <option value="pl-PL">Polski (pl-PL)</option>
        <option value="uk-UA">Українська (uk-UA)</option>
      </select>
      <label class="lbl" for="voiceMode">Кнопка 🎤</label>
      <select id="voiceMode">
        <option value="openai">Запись + OpenAI (надёжно)</option>
        <option value="auto">Распознавание в браузере</option>
        <option value="keyboard">Микрофон клавиатуры телефона</option>
      </select>
      <label class="lbl" for="oaKey">Ключ OpenAI (хранится только на этом телефоне)</label>
      <div class="cat-manage-row">
        <input type="password" id="oaKey" placeholder="sk-…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="icon-btn" type="button" id="oaSave" aria-label="Сохранить ключ">✓</button>
      </div>
      <div class="msg" id="oaMsg"></div>
      <div class="env-note" id="envNote"></div>
    </div>

    <div class="section">
      <h4>Данные</h4>
      <p>Записи хранятся только в этом браузере. Делай резервную копию, чтобы ничего не потерять.</p>
      <div class="btns">
        <button class="btn-ghost" type="button" id="exportCsv">Экспорт CSV</button>
        <button class="btn-ghost" type="button" id="exportJson">Резервная копия</button>
      </div>
      <div class="btns">
        <button class="btn-ghost" type="button" id="importJsonBtn">Восстановить из копии</button>
      </div>
      <input type="file" id="importJson" accept=".json,application/json" style="display:none">
      <div class="msg" id="dataMsg"></div>
    </div>
  </div>
</div>

<script id="zl-parser">
/* ===== Парсер диктовки / текста. Чистые функции, тестируются в node. ===== */
var ZL_DEFAULT_KEYWORDS = {
  "Продукты": ["продукт", "бедронк", "бедронок", "biedronk", "лидл", "lidl", "жабк", "żabk", "zabk", "магазин", "=еда", "=еду", "=еды",
    "супермаркет", "ашан", "auchan", "карфур", "carrefour", "kaufland", "кауфланд", "aldi", "альди", "netto", "нетто", "=dino", "=дино",
    "stokrot", "стокрот", "lewiatan", "левиатан", "хлеб", "молок", "овощ", "фрукт", "zakup", "закуп", "spożyw", "spozyw"],
  "Кафе": ["кафе", "кофе", "кофейн", "=кава", "=kawa", "kawiarn", "ресторан", "restaur", "обед", "ужин", "завтрак", "ланч", "пицц", "pizz",
    "бургер", "burger", "макдон", "mcdonald", "=kfc", "кебаб", "kebab", "суши", "sushi", "starbucks", "старбакс", "чай", "десерт", "мороженое"],
  "Транспорт": ["такси", "taxi", "=uber", "=убер", "=bolt", "=болт", "автобус", "autobus", "трамва", "tramwaj", "метро", "metro", "билет", "bilet",
    "парковк", "паркинг", "parking", "проезд", "поезд", "pociąg", "pociag", "электричк", "=pkp", "=пкп", "транспорт", "jakdojade", "freenow"],
  "Топливо": ["бензин", "benzyn", "заправк", "заправил", "орлен", "orlen", "дизел", "diesel", "топлив", "paliw", "=shell", "=шелл", "=bp", "=бп",
    "lotos", "лотос", "circle", "moya", "=амик", "=amic", "=lpg", "газ на"],
  "Аптека": ["аптек", "apteka", "aptek", "лекарств", "таблетк", "витамин", "leki", "=лек"],
  "Маникюр": ["маникюр", "педикюр", "ногт", "manicur", "manicure", "paznok", "гель-лак", "гельлак"],
  "Развлечения": ["кино", "kino", "=бар", "=бару", "=баре", "=bar", "концерт", "koncert", "театр", "teatr", "клуб", "боулинг", "музей", "muzeum",
    "развлеч", "аттракцион", "квест"],
  "Другое": []
};

var ZL_NUM = (function () {
  var m = {};
  function add(words, value, kind) { words.split(" ").forEach(function (w) { m[w] = { v: value, k: kind }; }); }
  add("ноль нуль", 0, "u"); add("один одна одно одну", 1, "u"); add("два две", 2, "u"); add("три", 3, "u");
  add("четыре", 4, "u"); add("пять", 5, "u"); add("шесть", 6, "u"); add("семь", 7, "u"); add("восемь", 8, "u"); add("девять", 9, "u");
  add("полтора полторы", 1.5, "u");
  add("десять", 10, "t"); add("одиннадцать", 11, "t"); add("двенадцать", 12, "t"); add("тринадцать", 13, "t");
  add("четырнадцать", 14, "t"); add("пятнадцать", 15, "t"); add("шестнадцать", 16, "t"); add("семнадцать", 17, "t");
  add("восемнадцать", 18, "t"); add("девятнадцать", 19, "t");
  add("двадцать", 20, "d"); add("тридцать", 30, "d"); add("сорок", 40, "d"); add("пятьдесят", 50, "d");
  add("шестьдесят", 60, "d"); add("семьдесят", 70, "d"); add("восемьдесят", 80, "d"); add("девяносто", 90, "d");
  add("полтинник", 50, "d");

function endOfLocalDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
}
function summaryPeriods(now) {
  now = now || new Date();

  var todayEnd = endOfLocalDay(now);
  var dow = (now.getDay() + 6) % 7;
  var weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  var weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 6, 23, 59, 59, 999);
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  var monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
  var yearStart = new Date(now.getFullYear(), 0, 1);
  var yearEnd = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
  return {
    today: { key: "today", start: todayStart, end: todayEnd, label: "Сегодня", card: "СЕГОДНЯ", highlight: false },
    week: { key: "week", start: weekStart, end: weekEnd, label: "Неделя", card: "НЕДЕЛЯ", highlight: false },
    month: { key: "month", start: monthStart, end: monthEnd, label: "Месяц", card: "МЕСЯЦ", highlight: true },
    year: { key: "year", start: yearStart, end: yearEnd, label: "Год", card: "ГОД", highlight: false }

}
function viewedMonthRange() {
  var y = viewMonth.getFullYear(), m = viewMonth.getMonth();

}
function periodSubtitle(p) {
  if (p.key === "month") return MONTHS[p.start.getMonth()] + " " + p.start.getFullYear();
  if (p.key === "year") return String(p.start.getFullYear());
  if (p.key === "today") return p.start.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  var a = p.start, b = p.end;
  if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()) {
    return a.getDate() + "–" + b.getDate() + " " + a.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
  }
  return a.toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + " – " +
    b.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
}
function recordsWord(n) {
  var n10 = n % 10, n100 = n % 100, w = "записей";
  if (n10 === 1 && n100 !== 11) w = "запись";

}

var drillState = null;
var drillReturnFocus = null;

function cloneState(s) {
  if (!s) return null;
  return {
    mode: s.mode, key: s.key, group: s.group, catId: s.catId, category: s.category,
    start: s.start, end: s.end, scopeLabel: s.scopeLabel, back: cloneState(s.back)
  };
}
function openPeriodDrill(key) {

  renderDrill();
  showDrill();
}
function openGroupDrill(group, range, back) {
  drillState = { mode: "group", group: group, start: range.start, end: range.end, scopeLabel: range.label, back: back || null };
  renderDrill();
  showDrill();
}
function openCategoryDrill(catId, range, back) {
  var dir = directionById(catId);
  drillState = {
    mode: "category", catId: catId, category: dir ? dir.name : "", group: dir ? dir.group : "",

  };
  renderDrill();
  showDrill();

function showDrill() {

    drillReturnFocus = document.activeElement;
    openSheet("drillOverlay");
  }
  var back = $("drillBack");
  var target = back && !back.hidden ? back : overlay.querySelector("[data-close]");
  if (target) target.focus();
}
function rangeForState(state) {
  if (!state) return null;
  if (state.mode === "period") {
    var p = summaryPeriods()[state.key];
    return { start: p.start, end: p.end };
  }
  if (state.back && state.back.mode === "period") {
    var p2 = summaryPeriods()[state.back.key];
    return { start: p2.start, end: p2.end };
  }
  if (state.back) return rangeForState(state.back);
  return { start: state.start, end: state.end };
}
function periodLabelOf(state) {

}
function itemsForState(state) {
  var range = rangeForState(state);
  var items = inRange(range.start, range.end);
  if (state.mode === "group") return items.filter(function (e) { return e.group === state.group; });
  if (state.mode === "category") return items.filter(function (e) { return e.catId === state.catId; });

}

    var p = summaryPeriods()[drillState.key];
    $("drillTitle").textContent = p.label;
    $("drillSub").textContent = periodSubtitle(p);
  } else if (drillState.mode === "group") {
    $("drillTitle").textContent = groupName(drillState.group);
    $("drillSub").textContent = periodLabelOf(drillState);
  } else {

  catsEl.innerHTML = "";

    var kicker = document.createElement("div");
    kicker.className = "drill-kicker";
    kicker.textContent = "Группы";

    var key = drillState.key;
    GROUPS.forEach(function (g) {
      var gCents = total(items.filter(function (e) { return e.group === g.id; }));
      appendDrillRow(catsEl, {
        group: g.id, cents: gCents, name: g.name,
        aria: g.name + ", " + fmt(gCents) + ". Показать записи",
        onClick: function () {

    }

  }
  if (!items.length) {

    var empty = document.createElement("div");

    if (drillState.mode === "group") empty.textContent = "В группе «" + groupName(drillState.group) + "» нет расходов за этот период";
    else empty.textContent = "В направлении «" + ($("drillTitle").textContent || "") + "» нет расходов за этот период";

      appendDrillRow(catsEl, {

        }
      });
    });
  }
  listLabel.hidden = false;
  sortExpensesDesc(items).forEach(function (e) { appendExpenseButton(list, e); });

function openEdit(id) {

function renameDirection(id, raw) {
  var dir = directionById(id);
  var name = String(raw || "").trim().replace(/\s+/g, " ");
  $("catMsg").textContent = "";
  if (!dir || isOtherName(dir.name)) return;
  if (!name || name === dir.name) return;
  if (name.length > 30) { $("catMsg").textContent = "Слишком длинное название"; return; }
  if (directions.some(function (d) { return d.id !== id && d.group === dir.group && sameName(d.name, name); })) {
    $("catMsg").textContent = "В группе «" + groupName(dir.group) + "» уже есть такое направление";
    return;
  }
  dir.name = name;
  expenses.forEach(function (e) { if (e.catId === id) e.category = name; });
  saveCats();
  save();
  renderCatManage();
}
function moveDirection(id) {
  var dir = directionById(id);

    mr.start();
    starting = false; listening = true; updateVoiceUi();
    showMsg("● Слушаю… говори: «продукты 70». Нажми ■, чтобы закончить.", "rec", true);
    clWatchSilence(stream);
    cl.maxT = setTimeout(clStop, 15000);
  }).catch(function (err) {
    cl.busy = false; starting = false; listening = false; updateVoiceUi();
    var n = err && err.name;
    if (n === "NotAllowedError" || n === "SecurityError") showMsg("Нет доступа к микрофону. Разреши: Настройки → Safari → Микрофон (или нажми «аА» в адресной строке → Настройки сайта → Микрофон → Разрешить).", "error", true);
    else showMsg(ERR["audio-capture"], "error", true);
  });
}
// автостоп: после речи 1.5 с тишины
function clWatchSilence(stream) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!cl.ctx) cl.ctx = new AC();
    if (cl.ctx.state === "suspended") cl.ctx.resume();
    var src = cl.ctx.createMediaStreamSource(stream), an = cl.ctx.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    var buf = new Uint8Array(an.fftSize), quietSince = Date.now(), startT = Date.now();
    clearInterval(cl.timer);
    cl.timer = setInterval(function () {
      if (!listening) { clearInterval(cl.timer); try { src.disconnect(); } catch (e) {} return; }
      an.getByteTimeDomainData(buf);
      var sum = 0; for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
      var rms = Math.sqrt(sum / buf.length), now = Date.now();
      if (rms > 0.035) { if (!cl.spoke) showMsg("● Слышу…", "rec", true); cl.spoke = true; quietSince = now; }
      if (cl.spoke && now - quietSince > 1500) clStop();
      else if (!cl.spoke && now - startT > 7000) clStop();
    }, 120);
  } catch (e) {}
}
function clStop() {
  clearTimeout(cl.maxT); clearInterval(cl.timer);
  listening = false; updateVoiceUi();
  if (cl.rec && cl.rec.state !== "inactive") { try { cl.rec.stop(); } catch (e) { clFinish("audio/mp4"); } }
}
function clFinish(mime) {
  var blob = new Blob(cl.chunks, { type: mime }); cl.chunks = []; cl.rec = null;
  // держим микрофон открытым минуту, чтобы следующая запись стартовала мгновенно
  cl.releaseT = setTimeout(clRelease, 60000);
  if (blob.size < 2000) { cl.busy = false; showMsg("Я ничего не услышал. Нажми 🎤 и говори сразу.", "error", true); return; }
  showMsg("Распознаю…", "info", true);
  var ext = /mp4|m4a|aac/.test(mime) ? "m4a" : /ogg/.test(mime) ? "ogg" : "webm";
  var fd = new FormData();
  fd.append("file", blob, "voice." + ext);
  fd.append("model", "gpt-4o-mini-transcribe");
  fd.append("language", clLang());
  fd.append("prompt", clPrompt());
  fd.append("response_format", "json");
  fetch("https://api.openai.com/v1/audio/transcriptions", { method: "POST", headers: { Authorization: "Bearer " + settings.oaKey }, body: fd })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
    .then(function (res) {
      cl.busy = false;
      if (!res.ok) {
        var m = (res.j && res.j.error && res.j.error.message) || ("код " + res.status);
        if (res.status === 401) showMsg("OpenAI не принял ключ. Вставь ключ заново в «Направления».", "error", true);
        else if (res.status === 429) showMsg("OpenAI: закончился баланс или лимит. Пополни Billing на platform.openai.com.", "error", true);
        else showMsg("Ошибка распознавания: " + m, "error", true);
        return;
      }
      var text = String((res.j && res.j.text) || "").replace(/[.!?]+$/, "").trim();
      if (!text) { showMsg("Я ничего не разобрал. Нажми 🎤 и скажи ещё раз.", "error", true); return; }
      var p = zlParse(text, namesForParse());
      if (p.hasAmount) { $("input").value = text; addExpense(text, p); return; }
      $("input").value = text;
      showMsg("Услышал «" + text + "», но не нашёл сумму. Допиши сумму и нажми «Записать».", "error", true);
    })
    .catch(function () { cl.busy = false; showMsg("Нет интернета — не удалось распознать. Попробуй ещё раз.", "error", true); });
}

$("btnVoice").addEventListener("click", function () {
  if (cloudMode()) { if (listening) clStop(); else if (!starting && !cl.busy) clStart(); return; }
  if (listening || starting) { stopListening(false); return; }
  if (keyboardMode()) {
    var reason = "";
    if (!SR) reason = isIOS && isStandalone ? "С иконки «Домой» распознавание недоступно." : "Этот браузер не умеет распознавать речь.";
    else if (isFile || insecure) reason = "Распознавание работает только на сайте по https.";
    useKeyboardDictation(reason);
    return;
  }
  // Первый раз запросим системный доступ к микрофону, чтобы появился запрос разрешения.
  // На iOS распознавание запускаем синхронно в нажатии (Safari сам спросит микрофон и «Распознавание речи»).
  if (!isIOS && !settings.micGranted && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    showMsg("Разреши доступ к микрофону…", "info", true);
    starting = true; updateVoiceUi();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      settings.micGranted = true; saveSettings();
      starting = false;
      startRecognition();
    }).catch(function (err) {
      starting = false; updateVoiceUi();
      var n = err && err.name;
      if (n === "NotAllowedError" || n === "SecurityError") {
        markBroken("denied");
        showMsg(deniedText() + " Нажми 🎤 ещё раз — откроется клавиатура с микрофоном.", "error", true);
      } else if (n === "NotFoundError" || n === "NotReadableError" || n === "OverconstrainedError") {
        showMsg(ERR["audio-capture"], "error", true);
      } else {
        startRecognition(); // неизвестная ошибка — пробуем распознавание напрямую
      }
    });
    return;
  }
  startRecognition();
});

// если доступ к микрофону отозвали — снова спросим
if (navigator.permissions && navigator.permissions.query) {
  try {
    navigator.permissions.query({ name: "microphone" }).then(function (st) {
      if (st.state !== "granted" && settings.micGranted) { settings.micGranted = false; saveSettings(); }
    }).catch(function () {});
  } catch (e) {}
}
document.addEventListener("visibilitychange", function () { if (document.hidden) { if (cloudMode()) { if (listening) clStop(); clRelease(); } else stopListening(true); } });

if (keyboardMode()) $("hint").textContent = "Нажми 🎤 — откроется клавиатура, там нажми её 🎤 и скажи: «продукты 70», «вчера кофе 18».";
updateVoiceUi();
render();

window.__zl = { get expenses() { return expenses; }, get directions() { return directions; }, fmt: fmt, env: envDescription };
})();
</script>
</body>
</html>
